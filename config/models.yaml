# Non-secret defaults. Environment variables override these; see src/ejudgment/config.py.

ingest_batch_size: 200

pdf_verify_pages: 2
pdf_verify_min_window_chars: 10000
# Share of the PDF sample's 20-character n-grams that must occur in the record's text.
# Measured on 400 real records: own PDFs score 1.0, other records' PDFs at most ~0.5.
pdf_verify_min_overlap: 0.8

# Chunking: tokens are counted with the embedding model's tokenizer (pinned revision).
tokenizer_model_id: BAAI/bge-small-en-v1.5
tokenizer_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
# Both baseline models accept at most 512 tokens; leave room for the embedding context prefix.
chunk_target_tokens: 350
chunk_max_tokens: 400

source_base_url: https://ghalii.org
search_max_top_k: 50
passages_per_case: 3

# Dense retrieval: bge-small (MIT), pinned; weights come from the HF cache (fetch-models).
embedding_model_id: BAAI/bge-small-en-v1.5
embedding_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
embedding_dimension: 384
embedding_max_input_tokens: 512
embedding_batch_size: 64
model_device: auto

# Reranker: MiniLM cross-encoder (Apache-2.0), pinned.
reranker_model_id: cross-encoder/ms-marco-MiniLM-L6-v2
reranker_revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
reranker_max_input_tokens: 512
rerank_top_n: 30

# Hybrid: fixed-size candidate pools per channel (stable pages), RRF constant, HNSW search breadth.
hybrid_channel_k: 450
rrf_k: 60
hnsw_ef_search: 200
# Neighbours fetched before per-case capping (600 covered 211-381 cases on real queries).
dense_raw_neighbours: 600
# offset + top_k may not exceed this many cases.
search_max_depth: 150
# Seconds a vector-coverage count is reused (search reports missing vectors as degraded).
embedding_coverage_ttl_seconds: 60

# OCR and conversion (worker.extract). Requires `brew install tesseract poppler`.
tesseract_cmd: tesseract
pdftoppm_cmd: pdftoppm
ocr_dpi: 300
ocr_language: eng
ocr_workers: 4
# Pages whose mean word confidence is below this are flagged low_ocr_confidence for review.
ocr_min_confidence: 60

# Proposition support (M3): NLI cross-encoder (Apache-2.0), pinned; fetched by fetch-models.
# A claim is kept only if a passage it cites entails it with at least this probability.
nli_model_id: cross-encoder/nli-deberta-v3-base
nli_revision: 6c749ce3425cd33b46d187e45b92bbf96ee12ec7
nli_max_input_tokens: 512
nli_min_entailment: 0.5

# Generation (M3 slice 1): local Ollama (`ollama pull <model>` first). No paid API is used.
llm_provider: ollama
ollama_base_url: http://localhost:11434
ollama_chat_model: gemma4:latest
# Context window requested from Ollama: system prompt + sources + answer must fit.
ollama_num_ctx: 8192
llm_timeout_seconds: 180
llm_max_output_tokens: 900
generation_max_passages: 8
generation_passages_per_case: 2
generation_max_context_tokens: 4000
# For a question naming a case (exact citation/case name): also its last chunks (decision, orders).
generation_case_closing_passages: 3
generation_max_claims: 8
# Claims must quote at least this many words of a passage they cite, or they are removed.
generation_min_quote_words: 4
